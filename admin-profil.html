<!DOCTYPE html> <html lang="fr"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>MaTontine - Administration des profils</title> <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"> <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"> <style> :root { --bg:#0a0a0b; --surface:#131314; --border:#2a2418; --gold:#e4b95d; --gold-light:#f5d98a; --red:#ff4d4d; --green:#70e085; --text:#f4f1ea; --muted:#8f8a7e; } * { margin:0; padding:0; box-sizing:border-box; font-family:Inter,sans-serif; } body { background:var(--bg); color:var(--text); min-height:100vh; } header { padding:17px 18px; display:flex; justify-content:space-between; align-items:center; background:#111; border-bottom:1px solid var(--border); } .logo { font-family:'Playfair Display',serif; font-size:20px; color:var(--gold); font-weight:700; } .admin-badge { color:var(--gold); background:#292113; border:1px solid #9c7428; padding:7px 10px; border-radius:20px; font-size:10px; font-weight:700; } .container { max-width:650px; margin:auto; padding:22px 16px; } #authAdminSection { min-height:75vh; display:flex; justify-content:center; align-items:center; } .login-card { width:100%; max-width:400px; padding:30px 22px; background:var(--surface); border:1px solid #9c7428; border-radius:20px; text-align:center; } .login-card h2 { color:var(--gold-light); margin:15px 0; font-family:'Playfair Display',serif; } .login-card p { color:var(--muted); font-size:12px; line-height:1.7; } .login-input { width:100%; padding:15px; margin:20px 0 15px; background:var(--bg); border:1px solid var(--border); border-radius:12px; color:white; font-size:15px; text-align:center; outline:none; } .login-input:focus { border-color:var(--gold); } button { cursor:pointer; } .btn-login { width:100%; padding:15px; background:linear-gradient(90deg,#b58a35,#f0d083); border:0; border-radius:12px; color:#17120a; font-weight:800; } #adminPanel { display:none; } .page-title { font-family:'Playfair Display',serif; font-size:24px; margin-bottom:8px; } .page-sub { color:var(--muted); font-size:13px; line-height:1.6; margin-bottom:25px; } .section-title { font-size:15px; margin:20px 0 15px; } .toolbar { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:15px; } .btn-refresh { background:#292113; border:1px solid var(--gold); color:var(--gold); padding:10px 13px; border-radius:10px; font-weight:700; font-size:11px; } .admin-card { background:var(--surface); border:1px solid var(--border); border-radius:17px; padding:17px; margin-bottom:15px; } .admin-card-header { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:15px; } .admin-card-header strong { color:var(--gold-light); font-size:14px; overflow-wrap:anywhere; } .status-badge { background:#292113; border:1px solid #9c7428; color:var(--gold); padding:5px 9px; border-radius:15px; font-size:10px; font-weight:700; } .details-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:12px; background:#191714; border-radius:12px; margin-bottom:12px; } .details-grid p { color:var(--muted); font-size:12px; line-height:1.7; overflow-wrap:anywhere; } .details-grid strong { color:white; } .change-box { background:#191714; border:1px solid var(--border); padding:13px; border-radius:12px; margin-bottom:10px; font-size:12px; line-height:1.8; overflow-wrap:anywhere; } .change-box h4 { color:var(--gold); margin-bottom:7px; } .old-value { color:#ff7777; } .new-value { color:var(--green); font-weight:700; } .actions { display:flex; gap:10px; margin-top:15px; } .btn-accept,.btn-reject { flex:1; padding:12px 7px; border-radius:10px; background:transparent; border:1px solid; font-size:12px; font-weight:800; } .btn-accept { color:var(--green); border-color:var(--green); } .btn-reject { color:var(--red); border-color:var(--red); } button:disabled { opacity:.5; cursor:not-allowed; } .empty { background:var(--surface); border:1px dashed var(--border); border-radius:17px; padding:35px 15px; text-align:center; color:var(--muted); font-size:13px; line-height:1.8; } .btn-logout { width:100%; padding:13px; margin-top:25px; background:#291313; color:var(--red); border:1px solid var(--red); border-radius:10px; font-weight:700; } .message { font-size:12px; margin-top:12px; line-height:1.6; } .error { color:var(--red); } .success { color:var(--green); } @media(max-width:380px) { .details-grid { grid-template-columns:1fr; } } </style> </head> <body> <header> <div class="logo">MaTontine - Admin</div> <div class="admin-badge"> <i class="fa-solid fa-user-shield"></i> ADMINISTRATION </div> </header> <div class="container"> <!-- CONNEXION --> <section id="authAdminSection"> <div class="login-card"> <i class="fa-solid fa-lock" style="font-size:36px;color:var(--gold)"></i> <h2>Accès Administrateur</h2> <p> Entrez votre mot de passe pour accéder à la gestion des profils. </p> <input type="password" id="adminPasswordInput" class="login-input" placeholder="Mot de passe administrateur" > <button type="button" class="btn-login" id="btnLoginAdmin"> <i class="fa-solid fa-right-to-bracket"></i> Se connecter </button> <div id="loginMessage" class="message"></div> </div> </section> <!-- PANNEAU ADMIN --> <section id="adminPanel"> <h2 class="page-title">Gestion des profils</h2> <p class="page-sub"> Consultez, acceptez ou refusez les demandes de modification des membres. </p> <h3 class="section-title"> <i class="fa-solid fa-user-pen" style="color:var(--gold)"></i> Demandes de modification </h3> <div class="toolbar"> <span id="requestCount" style="font-size:12px;color:var(--muted)"> En attente... </span> <button type="button" class="btn-refresh" id="refreshBtn"> <i class="fa-solid fa-rotate"></i> Actualiser </button> </div> <div id="adminRequestsContainer"> <div class="empty">Connexion à Firebase...</div> </div> <button type="button" class="btn-logout" id="logoutBtn"> <i class="fa-solid fa-right-from-bracket"></i> Déconnexion </button> </section> </div> <!-- CONNEXION ET GESTION DE SESSION --> <script> (function() { const MOT_DE_PASSE_ADMIN = "admin123"; const loginButton = document.getElementById("btnLoginAdmin"); const passwordInput = document.getElementById("adminPasswordInput"); const loginMessage = document.getElementById("loginMessage"); function ouvrirAdministration() { const password = passwordInput.value.trim(); if (password !== MOT_DE_PASSE_ADMIN) { loginMessage.textContent = "Mot de passe incorrect."; loginMessage.className = "message error"; passwordInput.value = ""; passwordInput.focus(); return; } sessionStorage.setItem("adminConnecte", "true"); document.getElementById("authAdminSection").style.display = "none"; document.getElementById("adminPanel").style.display = "block"; loginMessage.textContent = ""; if (typeof window.chargerDemandes === "function") { window.chargerDemandes(); } else { document.getElementById("adminRequestsContainer").innerHTML = '<div class="empty">Initialisation de Firebase...</div>'; } } loginButton.addEventListener("click", ouvrirAdministration); passwordInput.addEventListener("keydown", function(event) { if (event.key === "Enter") { ouvrirAdministration(); } }); document.getElementById("logoutBtn").addEventListener("click", function() { sessionStorage.removeItem("adminConnecte"); document.getElementById("adminPanel").style.display = "none"; document.getElementById("authAdminSection").style.display = "flex"; passwordInput.value = ""; loginMessage.textContent = ""; }); document.getElementById("refreshBtn").addEventListener("click", function() { if (typeof window.chargerDemandes === "function") { window.chargerDemandes(); } }); if (sessionStorage.getItem("adminConnecte") === "true") { document.getElementById("authAdminSection").style.display = "none"; document.getElementById("adminPanel").style.display = "block"; } })(); </script> <!-- FIREBASE --> <script type="module"> import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js"; import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js"; const firebaseConfig = { apiKey: "AIzaSyC6dju32G1ILcNaeB4KZc2VltTpJmVIS20", authDomain: "matontine-beefb.firebaseapp.com", databaseURL: "https://matontine-beefb-default-rtdb.firebaseio.com", projectId: "matontine-beefb", storageBucket: "matontine-beefb.firebasestorage.app", messagingSenderId: "642250537489", appId: "1:642250537489:web:562ebb2e83d1f51c7c4fb0" }; let db = null; try { const app = getApps().length ? getApp() : initializeApp(firebaseConfig); db = getDatabase(app); } catch(error) { console.error("Initialisation Firebase :", error); document.getElementById("adminRequestsContainer").innerHTML = '<div class="empty">Erreur d’initialisation Firebase : ' + echapper(error.message) + '</div>'; } function echapper(value) { return String(value ?? "").replace(/[&<>"']/g, function(char) { const caracteres = { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }; return caracteres[char]; }); } function nomChamp(champ) { const noms = { nom:"Nom complet", telephone:"Téléphone", numeroReception:"Numéro de réception" }; return noms[champ] || champ; } function dateLisible(date) { if (!date) return "Non renseignée"; const resultat = new Date(date); if (isNaN(resultat.getTime())) { return "Non renseignée"; } return resultat.toLocaleString("fr-FR"); } /* CHARGEMENT DES DEMANDES */ async function chargerDemandes() { const container = document.getElementById("adminRequestsContainer"); if (!db) { container.innerHTML = '<div class="empty">Firebase n’est pas disponible.</div>'; return; } container.innerHTML = '<div class="empty"><i class="fa-solid fa-spinner fa-spin"></i><br>Chargement...</div>'; try { const snapshot = await get(ref(db, "demandesModification")); const donnees = snapshot.val() || {}; const demandes = []; Object.entries(donnees).forEach(function([uid, liste]) { Object.entries(liste || {}).forEach(function([requestId, demande]) { demandes.push({ uid:uid, requestId:requestId, ...demande }); }); }); afficherDemandes(demandes); } catch(error) { console.error("Chargement des demandes :", error); container.innerHTML = '<div class="empty" style="color:var(--red)">Erreur Firebase : ' + echapper(error.message) + '</div>'; } } window.chargerDemandes = chargerDemandes; /* AFFICHAGE DES DEMANDES */ function afficherDemandes(demandes) { const container = document.getElementById("adminRequestsContainer"); container.innerHTML = ""; const enAttente = demandes.filter(function(demande) { return demande.statut === "en_attente"; }); document.getElementById("requestCount").textContent = enAttente.length + " demande(s) en attente"; if (enAttente.length === 0) { container.innerHTML = ` <div class="empty"> <i class="fa-solid fa-circle-check" style="font-size:28px;color:var(--green)"></i> <br><br> Aucune demande en attente. </div> `; return; } enAttente.forEach(function(demande) { const modifications = demande.modifications || {}; let changements = ""; Object.entries(modifications).forEach(function([champ, valeurs]) { changements += ` <div class="change-box"> <h4>${echapper(nomChamp(champ))}</h4> Ancienne valeur : <span class="old-value"> ${echapper(valeurs.ancien)} </span> <br> Nouvelle valeur : <span class="new-value"> ${echapper(valeurs.nouveau)} </span> </div> `; }); const estCodeSecret = demande.type === "changement_code_secret"; if (estCodeSecret) { changements = ` <div class="change-box"> <h4>Changement du code secret</h4> Cette demande nécessite une procédure de sécurité distincte. </div> `; } const card = document.createElement("div"); card.className = "admin-card"; card.innerHTML = ` <div class="admin-card-header"> <strong> <i class="fa-solid fa-user" style="color:var(--gold)"></i> ${echapper(demande.nomActuel || "Membre")} </strong> <span class="status-badge">EN ATTENTE</span> </div> <div class="details-grid"> <p> <strong>Téléphone :</strong><br> ${echapper(demande.telephoneActuel || "Non renseigné")} </p> <p> <strong>Date :</strong><br> ${dateLisible(demande.dateDemande)} </p> </div> ${changements} <div class="actions"> <button type="button" class="btn-accept"> <i class="fa-solid fa-check"></i> Accepter </button> <button type="button" class="btn-reject"> <i class="fa-solid fa-xmark"></i> Refuser </button> </div> `; const btnAccepter = card.querySelector(".btn-accept"); const btnRefuser = card.querySelector(".btn-reject"); btnAccepter.addEventListener("click", function() { traiterDemande( demande, "acceptee", btnAccepter, btnRefuser ); }); btnRefuser.addEventListener("click", function() { traiterDemande( demande, "refusee", btnAccepter, btnRefuser ); }); if (estCodeSecret) { btnAccepter.disabled = true; } container.appendChild(card); }); } /* ACCEPTER OU REFUSER */ async function traiterDemande(demande, statut, btn1, btn2) { if (statut === "acceptee" && demande.type === "changement_code_secret") { alert("Cette demande nécessite une procédure sécurisée distincte."); return; } const confirmation = statut === "acceptee" ? "Veux-tu accepter cette modification ?" : "Veux-tu refuser cette demande ?"; if (!confirm(confirmation)) return; btn1.disabled = true; btn2.disabled = true; try { const updates = {}; if (statut === "acceptee") { const champsAutorises = [ "nom", "telephone", "numeroReception" ]; let nombre = 0; champsAutorises.forEach(function(champ) { const valeur = demande.modifications?.[champ]?.nouveau; if (valeur !== undefined && valeur !== null) { updates[ "users/" + demande.uid + "/" + champ ] = valeur; nombre++; } }); if (nombre === 0) { throw new Error("Aucune modification valide trouvée."); } } else { updates[ "demandesModification/" + demande.uid + "/" + demande.requestId + "/motif" ] = "Demande refusée par l'administrateur."; } updates[ "demandesModification/" + demande.uid + "/" + demande.requestId + "/statut" ] = statut; updates[ "demandesModification/" + demande.uid + "/" + demande.requestId + "/dateTraitement" ] = Date.now(); await update(ref(db), updates); alert( statut === "acceptee" ? "Demande acceptée avec succès." : "Demande refusée avec succès." ); await chargerDemandes(); } catch(error) { console.error("Erreur de traitement :", error); alert("Erreur Firebase : " + error.message); btn1.disabled = false; btn2.disabled = false; } } /* RESTAURATION DE LA SESSION */ if (sessionStorage.getItem("adminConnecte") === "true") { chargerDemandes(); } </script> </body> </html>
