<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaTontine - Historique complet</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root {
    --bg:#0a0a0b;
    --surface:#131314;
    --surface2:#1a1a1c;
    --border:#2a2418;
    --gold:#e4b95d;
    --gold-light:#f5d98a;
    --muted:#8f8a7e;
    --text:#f4f1ea;
    --blue:#82b7ff;
    --green:#8fca91;
}

* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }

body {
    background:radial-gradient(900px 500px at 50% -180px,rgba(228,185,93,.14),transparent 70%),var(--bg);
    color:var(--text);
    min-height:100vh;
    padding-bottom:110px;
}

nav {
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:rgba(17,17,18,.96);
    backdrop-filter:blur(14px);
    border-top:1px solid var(--border);
    display:flex;
    padding-bottom:env(safe-area-inset-bottom);
    z-index:100;
}

nav a {
    flex:1;
    text-decoration:none;
    color:var(--muted);
    font-size:10px;
    font-weight:500;
    text-align:center;
    padding:10px 2px;
}

nav a i {
    display:block;
    font-size:16px;
    margin-bottom:5px;
}

nav a.active {
    color:var(--gold);
    background:rgba(228,185,93,.08);
    box-shadow:inset 0 2px 0 var(--gold);
}

nav a span {
    display:block;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

@media(max-width:360px) {
    nav a {font-size:9px;}
}

header {
    position:sticky;
    top:0;
    z-index:50;
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(10,10,11,.92);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
}

.logo {
    font-family:'Playfair Display',serif;
    font-size:22px;
    font-weight:700;
    background:linear-gradient(120deg,var(--gold-light),var(--gold));
    -webkit-background-clip:text;
    color:transparent;
}

.back {
    width:42px;
    height:42px;
    background:#211b10;
    border:1px solid var(--gold);
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    color:var(--gold);
    text-decoration:none;
    font-size:17px;
}

.container {
    padding:24px 18px;
    max-width:560px;
    margin:auto;
}

h2 {
    font-family:'Playfair Display',serif;
    font-size:26px;
    margin-bottom:6px;
}

.sub {
    color:var(--muted);
    font-size:13px;
    margin-bottom:20px;
}

.stats {
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-bottom:20px;
}

.stat-card {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px;
}

.stat-card p {
    color:var(--muted);
    font-size:11px;
}

.stat-card h3 {
    font-size:20px;
    margin-top:6px;
    color:var(--gold-light);
}

.tabs {
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-bottom:12px;
}

.tab {
    flex:0 0 auto;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--muted);
    padding:9px 14px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
    cursor:pointer;
}

.tab.active {
    background:#211b10;
    border-color:var(--gold);
    color:var(--gold);
}

.filters {
    display:flex;
    gap:8px;
    margin-bottom:18px;
}

.filters input,
.filters select {
    background:var(--surface2);
    border:1px solid #3a3122;
    color:var(--text);
    border-radius:10px;
    padding:11px;
    font-size:13px;
    min-width:0;
}

.filters input { flex:1; }
.filters select { max-width:45%; }

.card {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:16px;
    margin-bottom:10px;
}

.card-top {
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
    margin-bottom:8px;
    flex-wrap:wrap;
}

.badge {
    font-size:10px;
    font-weight:700;
    padding:4px 9px;
    border-radius:20px;
    background:rgba(228,185,93,.15);
    color:var(--gold);
    white-space:nowrap;
}

.badge.parrainage {
    background:rgba(143,202,145,.13);
    color:var(--green);
}

.badge.bonus {
    background:rgba(130,183,255,.13);
    color:var(--blue);
}

.statut {
    font-size:10px;
    padding:4px 9px;
    border-radius:20px;
    background:#2a2213;
    color:var(--gold);
    border:1px solid #4a3b23;
}

.titre {
    font-size:14px;
    font-weight:700;
    overflow-wrap:anywhere;
}

.montant {
    font-size:18px;
    font-weight:800;
    color:var(--gold-light);
    margin:6px 0;
}

.date {
    color:var(--muted);
    font-size:11px;
}

.details-toggle {
    margin-top:8px;
    background:none;
    border:none;
    color:var(--muted);
    font-size:11px;
    cursor:pointer;
    text-decoration:underline;
}

.details {
    margin-top:10px;
    padding:10px;
    border-radius:10px;
    background:rgba(26,22,14,.5);
    border:1px solid var(--border);
    font-size:11px;
    line-height:1.8;
    overflow-wrap:anywhere;
}

.details strong {
    color:var(--gold);
}

.empty {
    color:var(--muted);
    text-align:center;
    padding:30px 15px;
    font-size:12px;
    background:var(--surface);
    border-radius:18px;
    border:1px dashed #3a3122;
}

.erreur {
    color:#ffbaba;
    background:#451d1d;
    border:1px solid #a94444;
    padding:12px;
    border-radius:12px;
    font-size:12px;
    margin-bottom:12px;
    display:none;
}
</style>
</head>

<body>

<header>
    <div class="logo">MaTontine</div>
    <a href="accueil.html" class="back" aria-label="Accueil">
        <i class="fa-solid fa-house"></i>
    </a>
</header>

<div class="container">

    <h2>Historique complet</h2>
    <p class="sub">Jumelages, parrainages et bonus, du plus récent au plus ancien.</p>

    <div class="stats">
        <div class="stat-card">
            <p>Total affiché</p>
            <h3 id="statTotal">0</h3>
        </div>
        <div class="stat-card">
            <p>Montant cumulé</p>
            <h3 id="statMontant">0 F</h3>
        </div>
        <div class="stat-card">
            <p>Jumelages</p>
            <h3 id="statJumelages">0</h3>
        </div>
        <div class="stat-card">
            <p>Solde parrainage disponible</p>
            <h3 id="statAutres">0</h3>
        </div>
    </div>

    <div id="erreur" class="erreur"></div>

    <div class="tabs">
        <button class="tab active" data-type="tous">Tous</button>
        <button class="tab" data-type="jumelage">Jumelages</button>
        <button class="tab" data-type="parrainage">Parrainage</button>
        <button class="tab" data-type="commission">Commissions</button>
        <button class="tab" data-type="retrait">Retraits</button>
    </div>

    <div class="filters">
        <input id="recherche" type="text" placeholder="Rechercher un nom, un statut...">
        <select id="filtreStatut">
            <option value="">Tous statuts</option>
        </select>
    </div>

    <div id="liste">
        <div class="empty">Chargement...</div>
    </div>

</div>

<nav>
    <a href="accueil.html">
        <i class="fa-solid fa-house"></i><span>Accueil</span>
    </a>
    <a href="contributions.html">
        <i class="fa-solid fa-wallet"></i><span>Contribuer</span>
    </a>
    <a href="jumelages.html">
        <i class="fa-solid fa-people-arrows"></i><span>Jumelages</span>
    </a>
    <a href="parrainage.html">
        <i class="fa-solid fa-users"></i><span>Parrainage</span>
    </a>
    <a href="profil.html">
        <i class="fa-solid fa-user"></i><span>Profil</span>
    </a>
    <a href="historique.html" class="active">
        <i class="fa-solid fa-clock-rotate-left"></i><span>Historique</span>
    </a>
</nav>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";


/* CONFIGURATION FIREBASE (identique à accueil.html) */

const firebaseConfig = {
    apiKey: "AIzaSyC6dju32G1ILcNaeB4kZc2VltTpJmVIS20",
    authDomain: "matontine-beefb.firebaseapp.com",
    databaseURL: "https://matontine-beefb-default-rtdb.firebaseio.com",
    projectId: "matontine-beefb",
    storageBucket: "matontine-beefb.firebasestorage.app",
    messagingSenderId: "642250537489",
    appId: "1:642250537489:web:562ebb2e83d1f51c7c4fb0"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);


/* CHEMINS DES BASES (tous confirmés par les pages de l'application)
   jumelages : jumelages/{uid}/{matchId}
   filleuls : parrainages/{uid}/{filleulId}
   commissions : commissionsParrainage/{uid}/{id}
   retraits : demandesRetraitParrainage/{uid}/{id}
   utilisateurs : users/{uid} (codeParrainage, soldeParrainageDisponible, soldeParrainageReserve) */

const CHEMINS = {
    jumelages: "jumelages",
    filleuls: "parrainages",
    commissions: "commissionsParrainage",
    retraits: "demandesRetraitParrainage",
    utilisateurs: "users"
};


/* VARIABLES */

let entrees = [];
let filtreType = "tous";
let monSolde = 0;
let monReserve = 0;

const $ = id => document.getElementById(id);


/* OUTILS */

function nombre(valeur) {
    const n = Number(valeur);
    return Number.isFinite(n) ? n : 0;
}

function formatF(n) {
    return Number(n || 0).toLocaleString("fr-FR") + " F";
}

function echapper(v) {
    return String(v ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
    })[c]);
}

function premier(...valeurs) {
    return valeurs.find(v => v !== undefined && v !== null && v !== "") ?? "";
}

function formaterDate(t) {
    const n = nombre(t);
    return n > 0 ? new Date(n).toLocaleString("fr-FR") : "Date inconnue";
}

const LIBELLES_TYPE = {
    jumelage: "Jumelage",
    parrainage: "Filleul",
    commission: "Commission",
    retrait: "Retrait"
};

const LIBELLES_STATUT = {
    en_attente_jumelage: "En attente de jumelage",
    jumelage_partiel: "Jumelage partiel",
    en_attente_confirmation: "En attente de confirmation",
    en_attente_reception: "En attente de réception",
    en_cours_paiement: "Paiement en cours",
    confirmation_en_cours: "Confirmation en cours",
    paiement_declare: "Dépôt déclaré",
    confirme: "Confirmé",
    en_cours: "En cours",
    en_attente_reception_benefices: "En attente des bénéfices",
    termine: "Terminé",
    annule: "Annulé",
    annulee: "Annulée",
    rejete: "Rejeté",
    refuse: "Refusé"
};

function libelleStatut(s) {
    return LIBELLES_STATUT[s] || String(s || "—").replace(/_/g, " ");
}

/* Ne garde que les champs simples (texte, nombre, booléen) pour l'affichage détaillé */
function detailsSimples(d) {
    return Object.entries(d)
        .filter(([k, v]) =>
            v !== null &&
            typeof v !== "object" &&
            !["id", "uid", "token", "role", "groupeId", "demandePayeurId", "demandeBenefId"].includes(k)
        );
}

function normaliser(type, cle, d) {

    const dateRef = nombre(
        premier(d.dateCreation, d.dateJumelage, d.date, d.timestamp, d.createdAt)
    );

    let titre;

    if (type === "jumelage") {
        titre = d.role === "receveur"
            ? `Paiement reçu de ${premier(d.payeurNom, "Payeur")}`
            : `Dépôt à ${premier(d.beneficiaireNom, "Bénéficiaire")}`;
    } else {
        titre = premier(d.nom, d.libelle, d.titre, d.description, "Entrée sans libellé");
    }

    return {
        type,
        id: premier(d.id, cle),
        dateRef,
        titre: String(titre),
        montant: nombre(premier(d.montantPaiement, d.montant, d.bonus, d.valeur)),
        statut: String(premier(d.statut, d.status, "")),
        details: detailsSimples(d)
    };
}


function entreeSimple(type, cle, d, titre, montant, dateRef, statut) {
    const obj = d && typeof d === "object" ? d : {};
    const e = normaliser(type, cle, obj);
    e.titre = titre;
    e.montant = montant;
    if (dateRef !== undefined) e.dateRef = dateRef;
    if (statut !== undefined) e.statut = statut;
    return e;
}


/* CHARGEMENT : uniquement les données de l'utilisateur connecté */

async function charger(uid) {

    const erreurs = [];
    const toutes = [];

    /* JUMELAGES : chaque match est enregistré en deux copies (payeur et receveur).
       On ne garde que la copie du payeur pour éviter les doublons. */
    try {
        const snap = await get(ref(db, `${CHEMINS.jumelages}/${uid}`));
        Object.entries(snap.val() || {}).forEach(([matchId, m]) => {
            if (!m || typeof m !== "object") return;
            if (m.role !== "payeur" && m.role !== "receveur") return;
            toutes.push(normaliser("jumelage", matchId, m));
        });
    } catch (e) {
        erreurs.push("jumelages : " + e.message);
    }

    /* SOLDES DU PARRAINAGE */
    try {
        const profil = await get(ref(db, `${CHEMINS.utilisateurs}/${uid}`));
        const p = profil.val() || {};
        monSolde = nombre(p.soldeParrainageDisponible);
        monReserve = nombre(p.soldeParrainageReserve);
    } catch (e) {
        erreurs.push("solde : " + e.message);
    }

    /* FILLEULS */
    try {
        const relations = (await get(ref(db, `${CHEMINS.filleuls}/${uid}`))).val() || {};

        const profils = await Promise.all(
            Object.keys(relations).map(async id => {
                const s = await get(ref(db, `${CHEMINS.utilisateurs}/${id}`));
                return { id, data: s.val() || {}, relation: relations[id] };
            })
        );

        profils.forEach(({ id, data, relation }) => {
            const rel = relation && typeof relation === "object" ? relation : {};
            const nom = data.nom || rel.nom || "Membre";
            const date = Date.parse(data.dateInscription || rel.dateInscription || "") || 0;
            toutes.push(entreeSimple("parrainage", id, rel, "Filleul : " + nom, 0, date, ""));
        });
    } catch (e) {
        erreurs.push("filleuls : " + e.message);
    }

    /* COMMISSIONS */
    try {
        const snap = await get(ref(db, `${CHEMINS.commissions}/${uid}`));
        Object.entries(snap.val() || {}).forEach(([cle, d]) => {
            if (!d || typeof d !== "object") return;
            toutes.push(entreeSimple("commission", cle, d, "Commission de parrainage", nombre(d.montantCommission)));
        });
    } catch (e) {
        erreurs.push("commissions : " + e.message);
    }

    /* RETRAITS */
    try {
        const snap = await get(ref(db, `${CHEMINS.retraits}/${uid}`));
        Object.entries(snap.val() || {}).forEach(([cle, d]) => {
            if (!d || typeof d !== "object") return;
            toutes.push(entreeSimple("retrait", cle, d, "Demande de retrait", nombre(d.montant)));
        });
    } catch (e) {
        erreurs.push("retraits : " + e.message);
    }

    toutes.sort((a, b) => b.dateRef - a.dateRef);
    entrees = toutes;

    if (erreurs.length) {
        const zone = $("erreur");
        zone.style.display = "block";
        zone.textContent = "Certaines données n'ont pas pu être lues. " + erreurs.join(" | ");
    }

    remplirStatuts();
    actualiser();
}


/* FILTRES */

function remplirStatuts() {
    const select = $("filtreStatut");
    const valeur = select.value;

    const statuts = [...new Set(entrees.map(e => e.statut).filter(Boolean))].sort();

    select.innerHTML = '<option value="">Tous statuts</option>';

    statuts.forEach(s => {
        const option = document.createElement("option");
        option.value = s;
        option.textContent = libelleStatut(s);
        select.appendChild(option);
    });

    select.value = valeur;
}

function entreesFiltrees() {

    const texte = $("recherche").value.trim().toLowerCase();
    const statut = $("filtreStatut").value;

    return entrees.filter(e => {

        if (filtreType !== "tous" && e.type !== filtreType) return false;
        if (statut && e.statut !== statut) return false;

        if (texte) {
            const cible = (
                e.titre + " " +
                e.statut + " " +
                e.details.map(([k, v]) => `${k} ${v}`).join(" ")
            ).toLowerCase();

            if (!cible.includes(texte)) return false;
        }

        return true;
    });
}


/* AFFICHAGE */

function actualiser() {

    const liste = entreesFiltrees();

    $("statTotal").textContent = liste.length;
    $("statMontant").textContent = formatF(liste.reduce((s, e) => s + e.montant, 0));
    $("statJumelages").textContent = entrees.filter(e => e.type === "jumelage").length;
    $("statAutres").textContent = formatF(monSolde);

    const zone = $("liste");
    zone.innerHTML = "";

    if (!liste.length) {
        zone.innerHTML = '<div class="empty">Aucune entrée ne correspond à ces filtres.</div>';
        return;
    }

    liste.forEach(e => {

        const card = document.createElement("div");
        card.className = "card";

        const detailsHtml = e.details
            .map(([k, v]) => `<strong>${echapper(k)}</strong> : ${echapper(v)}`)
            .join("<br>");

        card.innerHTML = `
            <div class="card-top">
                <span class="badge ${e.type}">${LIBELLES_TYPE[e.type]}</span>
                ${e.statut ? `<span class="statut">${echapper(libelleStatut(e.statut))}</span>` : ""}
            </div>
            <div class="titre">${echapper(e.titre)}</div>
            ${e.montant > 0 ? `<div class="montant">${formatF(e.montant)}</div>` : ""}
            <div class="date">${echapper(formaterDate(e.dateRef))}</div>
            <button class="details-toggle">Voir les détails</button>
            <div class="details" style="display:none">${detailsHtml || "Aucun détail"}</div>
        `;

        const bouton = card.querySelector(".details-toggle");
        const bloc = card.querySelector(".details");

        bouton.addEventListener("click", () => {
            const ouvert = bloc.style.display === "block";
            bloc.style.display = ouvert ? "none" : "block";
            bouton.textContent = ouvert ? "Voir les détails" : "Masquer les détails";
        });

        zone.appendChild(card);
    });
}


/* ÉVÉNEMENTS */

document.querySelectorAll(".tab").forEach(bouton => {
    bouton.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        bouton.classList.add("active");
        filtreType = bouton.dataset.type;
        actualiser();
    });
});

$("recherche").addEventListener("input", actualiser);
$("filtreStatut").addEventListener("change", actualiser);


/* CONNEXION */

onAuthStateChanged(auth, user => {

    if (!user) {
        window.location.replace("index.html");
        return;
    }

    charger(user.uid);

});

</script>

</body>
</html>
